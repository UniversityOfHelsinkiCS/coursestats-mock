on:
  push:
    branches: 
      - master
jobs:
  build:
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Publish to Registry
      uses: redhat-actions/push-to-registry@v3
      with:
        name: registry.version.helsinki.fi/toska/openshift/kontit/coursestats-mock
        tags: latest
        registry: registry.version.helsinki.fi/toska/openshift/kontit/
        username: kontit
        password: ${{ secrets.VERSION_PUSH_SECRET }}
